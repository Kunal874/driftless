# Local dev environment for Driftless. Every port binds to 127.0.0.1 only,
# so nothing here is reachable from other machines on the network.
# Credentials below are local-dev values, not secrets (see docs/CONSTRAINTS.md).
name: driftless

services:
  postgres:
    image: postgres:17.11
    # wal_level=logical makes Postgres record enough detail in its WAL to stream
    # row-level changes (logical decoding), which is how Driftless reads changes.
    # max_slot_wal_keep_size caps the WAL a replication slot may hold (default: unlimited). Without it, a
    # Driftless that's down for long enough fills this disk and stops Postgres itself. With it, Postgres gives the
    # slot up instead, and Driftless refuses to start with recovery steps (T08.4, docs/ROLLBACK.md).
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=1GB"]
    environment:
      POSTGRES_USER: driftless
      POSTGRES_PASSWORD: driftless
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5440:5432" # host 5440: 5432-5434 are taken by other Postgres instances on this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro # schema; runs only when pgdata is empty
      - ./db:/db:ro # seed + workload SQL, used via `docker compose exec postgres ...`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftless -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.54.3
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: driftless-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.1-alpine
    # The cache Driftless keeps in sync, next to the index (T12, D-029). AOF with appendfsync=always: Redis replies only
    # once a write is on disk, so whatever Driftless counts as applied survives a Redis crash. The default (everysec)
    # can lose the last second on an OS crash or power loss, which can roll a key back to an OLDER value: a stale cache.
    # RDB snapshots are off (--save ""): the AOF is the copy. The three REDIS_* variables exist only for the crash
    # experiment (scripts/redis-crash.sh), which also runs Redis's out-of-the-box setup: no AOF, snapshots only.
    command: ["redis-server", "--appendonly", "${REDIS_APPENDONLY:-yes}", "--appendfsync", "${REDIS_APPENDFSYNC:-always}",
              "--save", "${REDIS_SAVE:-}"]
    ports:
      - "127.0.0.1:6381:6379" # host 6381: 6379 and 6380 are taken by other projects' containers on this machine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  connector:
    # Driftless itself, built from the Dockerfile (T10.2). Starts only when asked for, so it never competes
    # with `node src/main.ts` on the host for the replication slot:  docker compose up -d --build connector
    # (--build after code changes; the test scripts build it themselves).
    profiles: ["connector"]
    build: .
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      MEILI_HOST: http://meilisearch:7700
      REDIS_URL: redis://redis:6379
      DRIFTLESS_LANES: ${DRIFTLESS_LANES:-8} # override per run, e.g. DRIFTLESS_LANES=1 docker compose up -d connector
      DRIFTLESS_BATCH_MAX: ${DRIFTLESS_BATCH_MAX:-5000}
      DRIFTLESS_MAX_PENDING: ${DRIFTLESS_MAX_PENDING:-50000} # backpressure cap (T08)
      DRIFTLESS_BACKFILL: ${DRIFTLESS_BACKFILL:-} # 1 = backfill existing rows on start (T07)
      DRIFTLESS_BACKFILL_CHUNK: ${DRIFTLESS_BACKFILL_CHUNK:-10000}
      DRIFTLESS_BACKFILL_DEBUG_DELAY_MS: ${DRIFTLESS_BACKFILL_DEBUG_DELAY_MS:-0}
      DRIFTLESS_METRICS_HOST: 0.0.0.0 # inside the container, so Prometheus can reach it; the host port below stays local
    ports:
      - "127.0.0.1:9464:9464" # GET /metrics (T09)
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The supervisor half of fail-stop (D-009): whenever Driftless exits (crash, kill, fatal error),
    # Docker starts it again; it resumes from the slot's confirmed position.
    restart: unless-stopped

  # Metrics (T09), only when asked for:  docker compose --profile metrics up -d
  # Grafana: http://127.0.0.1:3000 (dashboard "Driftless", no login needed to view). Prometheus: http://127.0.0.1:9090
  prometheus:
    profiles: ["metrics"]
    image: prom/prometheus:v3.15.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["metrics"]
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local dev only: anyone who can reach 127.0.0.1:3000 may VIEW
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/driftless.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  meilidata:
  redisdata:
